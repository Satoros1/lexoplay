name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          New-Item -ItemType Directory -Force selftest/logs | Out-Null
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>&1 | Tee-Object -FilePath selftest/logs/install.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pip freeze | Out-File selftest/logs/freeze.txt

      - name: Unit tests
        run: |
          pytest -q 2>&1 | Tee-Object -FilePath selftest/logs/pytest.txt
          exit $LASTEXITCODE

      # На серверной Windows английского OCR может не быть. Пробуем поставить, но не падаем:
      # без него самопроверка пометит OCR как warn.
      - name: English OCR language pack (best effort)
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          Get-WindowsCapability -Online -Name "Language.OCR*" | Where-Object Name -like "*en-US*" | Format-Table Name, State
          Add-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0"

      - name: Self-test (from source)
        run: |
          python -m lexoplay --selftest --report selftest/source/report.json 2>&1 | Tee-Object -FilePath selftest/logs/selftest-source.txt
          exit $LASTEXITCODE

      - name: Build exe
        run: |
          python packaging/make_icon.py packaging/lexoplay.ico
          pyinstaller --noconfirm --clean --onefile --windowed --name LexoPlay `
            --icon packaging/lexoplay.ico `
            --collect-all winrt `
            --collect-submodules lexoplay `
            --hidden-import keyring.backends.Windows `
            --copy-metadata keyring `
            packaging/entry.py 2>&1 | Tee-Object -FilePath selftest/logs/pyinstaller.txt
          exit $LASTEXITCODE

      - name: Self-test (built exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force selftest/exe | Out-Null
          $report = Join-Path $PWD "selftest/exe/report.json"
          $p = Start-Process -FilePath dist/LexoPlay.exe -ArgumentList "--selftest","--report",$report -Wait -PassThru
          Get-Content $report
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest/

      # Отчёт и логи последней сборки лежат ещё и в ветке ci-results: их можно забрать
      # обычным git fetch, без доступа к хранилищу артефактов.
      - name: Publish self-test to ci-results branch
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "ci-results"
          New-Item -ItemType Directory -Force $dst | Out-Null
          if (Test-Path selftest) { Copy-Item -Recurse -Force selftest/* $dst }
          if (Test-Path dist/LexoPlay.exe) { (Get-Item dist/LexoPlay.exe).Length | Out-File (Join-Path $dst "exe-size.txt") }
          Set-Location $dst
          "sha=${{ github.sha }} run=${{ github.run_id }} ref=${{ github.ref }} status=${{ job.status }} at=$(Get-Date -Format o)" | Out-File RUN.txt
          git init -q -b ci-results
          git config user.name "lexoplay-ci"
          git config user.email "lexoplay-ci@users.noreply.github.com"
          git add -A
          git commit -qm "self-test ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

      - uses: actions/upload-artifact@v4
        with:
          name: LexoPlay-exe
          path: dist/LexoPlay.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LexoPlay.exe
          generate_release_notes: true
