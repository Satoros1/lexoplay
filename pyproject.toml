[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lexoplay"
version = "0.3.3"
description = "Перевод реплик в играх по клавише + слова в Lexo"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "anthropic>=1.0,<2",
    "keyring>=24.0",
    "httpx>=0.27",
    "mss>=9.0; sys_platform == 'win32'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.5"]

[project.scripts]
lexoplay = "lexoplay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
